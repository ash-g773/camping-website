<body>

  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <a class="navbar-brand" href="#">Navbar w/ text</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarText">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item active">
          <a class="nav-link" href="#">Home <span class="sr-only">(current)</span></a>
        </li>
        <li class="nav-item">

        </li>

      </span>

    <section id="contact">
        <div class="container">
            <h2>Contact us for an advice!</h2>
            <form>
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" required><br><br>
    
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required><br><br>
    
                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="4" required></textarea><br><br>
    
                <input type="submit" value="Send">
              
            <div class="contact-links">
              <a href="insert_link" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/5968/5968764.png" alt="Facebook">
              Facebook
              </a>

              <a href="insert_whatsapp_qr" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/3536/3536445.png" alt="WhatsApp">
              WhatsApp    
              </a>

              <a href="mailto:insert_email">
                <img src="https://cdn-icons-png.flaticon.com/512/561/561127.png" alt="Email">
              insert_email
              </a>
             </div>

            </form>
        </div>
    </section>
